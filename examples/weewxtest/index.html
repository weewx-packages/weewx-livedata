<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kirchdorf, live</title>
<style>
  :root {
    color-scheme: light dark;
    --ink: light-dark(#16222e, #e6edf3);
    --faint: light-dark(#6b7b8a, #8b98a5);
    --line: light-dark(#dfe6ec, #2a3038);
    --surface: light-dark(#fff, #171b21);
    --bg: light-dark(#f6f8fa, #0e1116);
    --accent: light-dark(#2f6fa8, #6fa9d6);
    --warm: light-dark(#c2410c, #fb923c);
    --cool: light-dark(#1d6fa5, #60a5fa);
  }
  * { box-sizing: border-box; }
  body {
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    margin: 0; padding: 2rem 1rem 3rem;
    background: var(--bg); color: var(--ink);
    display: flex; flex-direction: column; align-items: center; gap: 1.5rem;
  }
  header { text-align: center; }
  h1 { font-size: 1.0625rem; font-weight: 600; margin: 0 0 .35rem; letter-spacing: -.01em; }
  .sub { font-size: .8125rem; color: var(--faint); }

  /* The dot is the only thing that says the data is arriving rather than merely
     present. It pulses on a poll that brought something newer, so a stopped
     station shows a still dot. */
  .beat {
    display: inline-block; width: .5rem; height: .5rem; border-radius: 50%;
    background: var(--accent); margin-right: .4rem; vertical-align: middle;
    opacity: .35;
  }
  .beat.on { animation: beat 1.1s ease-out; }
  @keyframes beat {
    0%   { opacity: 1; box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 55%, transparent); }
    70%  { opacity: 1; box-shadow: 0 0 0 .5rem transparent; }
    100% { opacity: .35; box-shadow: 0 0 0 0 transparent; }
  }

  .panel {
    width: 100%; max-width: 46rem; background: var(--surface);
    border: 1px solid var(--line); border-radius: 12px; overflow: hidden;
  }
  .row { padding: .95rem 1.15rem; border-top: 1px solid var(--line); }
  .row:first-child { border-top: 0; }
  .head { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; }
  .label { font-size: .875rem; color: var(--faint); }
  .value { font-size: 1.5rem; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
  .unit { font-size: .8125rem; color: var(--faint); margin-left: .2rem; }

  /* Where today's reading sits between today's low and high. A pair of numbers
     says the same thing, but not at a glance. */
  .span { margin-top: .6rem; }
  .track {
    position: relative; height: 4px; border-radius: 2px;
    background: linear-gradient(to right,
      color-mix(in srgb, var(--cool) 45%, transparent),
      color-mix(in srgb, var(--warm) 45%, transparent));
  }
  .dot {
    position: absolute; top: 50%; width: 9px; height: 9px; border-radius: 50%;
    background: var(--ink); border: 2px solid var(--surface);
    transform: translate(-50%, -50%); transition: left .6s cubic-bezier(.4,0,.2,1);
  }
  .ends {
    display: flex; justify-content: space-between;
    font-size: .75rem; color: var(--faint); margin-top: .3rem;
    font-variant-numeric: tabular-nums;
  }
  .peak { font-size: .75rem; color: var(--faint); margin-top: .45rem;
          font-variant-numeric: tabular-nums; }

  .bar {
    display: flex; align-items: center; gap: .5rem; flex-wrap: wrap;
    padding: .8rem 1.15rem; border-bottom: 1px solid var(--line);
  }
  .tabs { display: flex; gap: .25rem; }
  button {
    font: inherit; font-size: .8125rem; color: var(--ink); cursor: pointer;
    background: transparent; border: 1px solid var(--line);
    border-radius: 7px; padding: .3rem .7rem;
  }
  button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  button:disabled { opacity: .35; cursor: default; }
  .when { margin-left: auto; font-size: .8125rem; color: var(--faint);
          font-variant-numeric: tabular-nums; }
  .chart { height: 190px; width: 100%; }
  .chart-title { font-size: .8125rem; color: var(--faint); padding: .8rem 1.15rem 0; }
  .note { font-size: .75rem; color: var(--faint); padding: .9rem 1.15rem; }

  body.stale .panel.live { opacity: .5; }
  .langs { display: flex; gap: .25rem; justify-content: center; margin-top: .7rem; }
  .langs button { font-size: .75rem; padding: .2rem .55rem; }
  footer { font-size: .75rem; color: var(--faint); text-align: center; }
  footer code { font-size: .6875rem; }
</style>
</head>
<body>

<header>
  <h1 id="place">&nbsp;</h1>
  <div class="sub"><span class="beat" id="beat"></span><span id="age"></span></div>
  <div class="langs" id="langs"></div>
</header>

<div class="panel live" id="card"></div>

<div class="panel">
  <div class="bar">
    <div class="tabs" id="spans"></div>
    <button id="back" title="Früher">&larr;</button>
    <button id="fwd" title="Später" disabled>&rarr;</button>
    <button id="now" disabled>Jetzt</button>
    <span class="when" id="when"></span>
  </div>
  <div id="charts"></div>
</div>

<div class="panel" id="records" hidden>
  <div class="chart-title" id="records-title"></div>
  <div id="records-body"></div>
</div>

<footer>
  <code>live.json</code> &middot; <code>data/archive/</code> &middot;
  <code>records.json</code> &middot; <code>lang/&lt;code&gt;/lang.json</code><br>
  Alles von WeeWX geschrieben. Die Seite kennt nur JSON.
</footer>

<script src="echarts.min.js"></script>
<script>
/* ------------------------------------------------------------------ units

   Nothing about units is written into this page. index.json carries which group
   each observation belongs to, which unit the report renders that group in, and
   the arithmetic between any two units. That is what lets a page WeeWX never
   rendered show the same numbers its reports show. */
var U = null;
var SYSTEM = {1: 'US', 16: 'METRIC', 17: 'METRICWX'};

/* Two languages, each rendered by its own report. The language file brings the
   names of the readings and the unit each one is shown in, so switching
   language switches units with it, which is what a reader in Boston expects. */
var LANGS = [{code: 'de', label: 'Deutsch', locale: 'de-DE'},
             {code: 'en', label: 'English (US)', locale: 'en-US'}];
var lang = null;                               /* the chosen entry of LANGS */
var L = null;                                  /* its lang.json */

/* Where a reading is meant to end up. The language file says it, and it says it
   because the report that wrote it was run in that unit system. */
function wantedUnit(obs) {
  if (L && L.units && L.units[obs]) { return L.units[obs]; }
  var group = U && U.groups ? U.groups[obs] : null;
  return group && U.report ? U.report[group] : null;
}

/* From any unit to any other, out of the table in index.json. */
function convert(value, from, to) {
  if (!from || !to || from === to) { return value; }
  var steps = U.convert && U.convert[from] ? U.convert[from][to] : null;
  return steps ? value * steps[0] + steps[1] : null;
}

function label(unit) {
  return ((U.labels && U.labels[unit]) || '').trim();
}

function t(key, fallback) {
  return (L && L.text && L.text[key]) || fallback || key;
}

/* A live reading in the unit the report uses. The live file is raw, in whatever
   the station measures in, so this is where it is brought into line with
   everything else on the page. */
function inReportUnit(obs, value, usUnits) {
  var group = U && U.groups ? U.groups[obs] : null;
  var system = U && U.systems ? U.systems[SYSTEM[usUnits]] : null;
  var from = group && system ? system[group] : null;
  var want = wantedUnit(obs);
  if (!from || !want) { return null; }
  var out = convert(value, from, want);
  return out === null ? null : {value: out, unit: want, label: label(want)};
}

function places(unit) {
  var f = U && U.formats ? U.formats[unit] : null;
  var m = f ? f.match(/%\.(\d+)f/) : null;
  return m ? Number(m[1]) : 1;
}

function fmt(value, dp) {
  return value.toLocaleString(lang ? lang.locale : 'de-DE',
                              {minimumFractionDigits: dp, maximumFractionDigits: dp});
}

/* ------------------------------------------------------------------- live */

/* No names here. Every reading is called what WeeWX calls it in the chosen
   language, which is what lang.json carries. 'dayRain' has no name of its own,
   so it borrows the one for rain. */
var ROWS = [
  {obs: 'outTemp',     span: true},
  {obs: 'outHumidity'},
  {obs: 'barometer',   span: true},
  {obs: 'windSpeed',   peak: 'windGust'},
  {obs: 'dayRain',     naming: 'rain'},
  {obs: 'radiation'}
];

var card = document.getElementById('card');
ROWS.forEach(function (row) {
  var el = document.createElement('div');
  el.className = 'row';
  el.dataset.obs = row.obs;
  el.hidden = true;
  el.innerHTML =
    '<div class="head"><span class="label" data-label></span>'
    + '<span><span class="value" data-value>--</span>'
    + '<span class="unit" data-unit></span></span></div>'
    + (row.span ? '<div class="span" data-span hidden><div class="track">'
        + '<span class="dot" data-dot></span></div>'
        + '<div class="ends"><span data-min></span><span data-max></span></div></div>' : '')
    + (row.peak ? '<div class="peak" data-peak hidden></div>' : '');
  card.appendChild(el);
});

function nameOf(obs, naming) {
  return (L && L.labels ? (L.labels[naming || obs] || L.labels[obs]) : null) || obs;
}

function paintLive(live) {
  ROWS.forEach(function (row) {
    var el = card.querySelector('[data-obs="' + row.obs + '"]');
    var raw = live.current[row.obs];
    var shown = (raw === undefined || raw === null)
      ? null : inReportUnit(row.obs, raw, live.usUnits);
    if (!shown) { el.hidden = true; return; }
    el.hidden = false;

    var dp = places(shown.unit);
    el.querySelector('[data-label]').textContent = nameOf(row.obs, row.naming);
    el.querySelector('[data-value]').textContent = fmt(shown.value, dp);
    el.querySelector('[data-unit]').textContent = shown.label.trim();

    var day = live.day[row.obs];
    var span = el.querySelector('[data-span]');
    if (span && day && day.min !== null && day.max !== null) {
      var lo = inReportUnit(row.obs, day.min, live.usUnits);
      var hi = inReportUnit(row.obs, day.max, live.usUnits);
      span.hidden = false;
      el.querySelector('[data-min]').textContent = fmt(lo.value, dp) + ' ' + lo.label.trim();
      el.querySelector('[data-max]').textContent = fmt(hi.value, dp) + ' ' + hi.label.trim();
      /* One reading makes no range for a dot to sit in. The middle is where it
         is, with nothing above or below it yet. */
      var at = hi.value > lo.value
        ? (shown.value - lo.value) / (hi.value - lo.value) * 100 : 50;
      el.querySelector('[data-dot]').style.left = Math.max(0, Math.min(100, at)) + '%';
    } else if (span) {
      span.hidden = true;
    }

    var peak = el.querySelector('[data-peak]');
    if (peak) {
      var gust = live.day[row.peak];
      var g = (gust && gust.max !== null)
        ? inReportUnit(row.peak, gust.max, live.usUnits) : null;
      peak.hidden = !g;
      if (g) {
        peak.textContent = t('peak_gust') + ': ' + fmt(g.value, places(g.unit))
                         + ' ' + g.label.trim();
      }
    }
  });
}

var beat = document.getElementById('beat');
var lastSeen = 0;
/* The last payload, kept so that a change of language can repaint the readings
   without waiting for the station to send another. */
var latest = null;

/* Counted every second off the last timestamp, not once per poll. On the poll it
   stood still for five seconds and then jumped, which reads as a page that has
   stopped rather than one that is waiting. */
function showAge() {
  if (!lastSeen) { document.getElementById('age').textContent = t('waiting'); return; }
  var age = Math.max(0, Math.round(Date.now() / 1000 - lastSeen));
  /* The language file carries the whole phrase with a %s in it, because where
     the number goes is not the same in every language. */
  var phrase = age < 60   ? [t('ago_seconds'), age]
             : age < 3600 ? [t('ago_minutes'), Math.round(age / 60)]
             :              [t('ago_hours'), Math.round(age / 3600)];
  document.getElementById('age').textContent = phrase[0].replace('%s', phrase[1]);
  document.body.classList.toggle('stale', age > 120);
}

function pollLive() {
  fetch('live.json?t=' + Date.now(), {cache: 'no-store'})
    .then(function (r) { return r.ok ? r.json() : null; })
    .then(function (live) {
      if (!live || !live.current) { return; }
      latest = live;
      if (live.dateTime > lastSeen) {
        lastSeen = live.dateTime;
        beat.classList.remove('on');
        void beat.offsetWidth;                 /* restart the animation */
        beat.classList.add('on');
        paintLive(live);
      }
      showAge();
    })
    .catch(function () { /* a missed poll says nothing; the next one will */ });
}

/* ----------------------------------------------------------------- charts */

/* 'lead' is the reading whose unit the whole chart is drawn in: a chart of
   temperature and dew point is one axis, and both belong on it. */
/* 'groups' names the archive groups a card draws, and 'lead' the observation
   whose unit the card is labelled in. Both are lists of the JSON generator's own
   group names, so a card is added by naming groups, not by writing a fetch. */
var CHARTS = [
  {key: 'tempdew', groups: ['tempdew'],   text: 'charts_temp', lead: 'outTemp'},
  {key: 'baro',    groups: ['barometer'], text: 'charts_baro', lead: 'barometer'},
  {key: 'wind',    groups: ['wind'],      text: 'charts_wind', lead: 'windSpeed'},
  /* Rain is a total, not a level. A line through it says nothing: the readings
     between two showers are zero, and joining them draws a floor rather than
     rainfall. Bars, each holding what fell in its own stretch of time.

     Evaporation is measured the same way and in the same unit, so the two share
     one card: what arrived against what left. */
  {key: 'water', groups: ['rain', 'ET'], text: 'charts_water', lead: 'rain',
   bars: true}
];

/* 'bucket' is how much time one bar holds. An hour is the right size for a day
   and still readable across a week; a year in hourly bars would be 8760 of them,
   most a pixel wide and empty. */
var SPANS = [
  {key: 'day',   text: 'day',   bucket: 3600},
  {key: 'week',  text: 'week',  bucket: 3 * 3600},
  {key: 'month', text: 'month', bucket: 86400},
  {key: 'year',  text: 'year',  bucket: 7 * 86400}
];

/* Readings summed into stretches of 'seconds', keyed by the start of each.
   Converting before adding is safe here because rain has no offset in its
   conversion, only a factor: millimetres to inches is one multiplication either
   way round. It would not be safe for a temperature. */
function intoBuckets(points, seconds) {
  var totals = {};
  points.forEach(function (point) {
    var at = Math.floor(point[0] / 1000 / seconds) * seconds * 1000;
    totals[at] = (totals[at] || 0) + point[1];
  });
  return Object.keys(totals).map(function (at) {
    return [Number(at), totals[at]];
  }).sort(function (a, b) { return a[0] - b[0]; });
}

var archive = null;
var span = SPANS[0];
var back = 0;                                  /* whole units into the past */

/* Which day a week starts on. The two languages the page offers disagree, and
   the answer decides where a week window is cut. */
var MONDAY_FIRST = {de: true, en: false};

/* The unit containing 'when', from its first moment. */
function startOf(when, key) {
  var d = new Date(when.getFullYear(), when.getMonth(), when.getDate());
  if (key === 'week') {
    var first = MONDAY_FIRST[lang.code] ? 1 : 0;
    d.setDate(d.getDate() - ((d.getDay() - first + 7) % 7));
  } else if (key === 'month') {
    d.setDate(1);
  } else if (key === 'year') {
    d.setMonth(0, 1);
  }
  return d;
}

/* 'by' units later, or earlier where it is negative. Counted on the calendar,
   not in seconds: a month is 28 to 31 days, a year 365 or 366, and the hour a
   clock change adds belongs to the day it falls in rather than pushing every
   window before it out of line. */
function step(when, key, by) {
  var d = new Date(when.getTime());
  if (key === 'day') { d.setDate(d.getDate() + by); }
  else if (key === 'week') { d.setDate(d.getDate() + 7 * by); }
  else if (key === 'month') { d.setMonth(d.getMonth() + by); }
  else { d.setFullYear(d.getFullYear() + by); }
  return d;
}
var made = {};
var cache = {};

function pad(n) { return n < 10 ? '0' + n : '' + n; }

/* The keys the index writes for the files a window touches: day files by date,
   month files by month, year files by year. */
function stamps(from, to, unit) {
  var out = [];
  var at = new Date(from * 1000);
  at.setHours(0, 0, 0, 0);
  if (unit !== 'day') { at.setDate(1); }
  if (unit === 'year') { at.setMonth(0); }
  while (at.getTime() / 1000 < to) {
    var y = at.getFullYear();
    out.push(unit === 'day'   ? y + '-' + pad(at.getMonth() + 1) + '-' + pad(at.getDate())
           : unit === 'month' ? y + '-' + pad(at.getMonth() + 1)
           :                    '' + y);
    if (unit === 'day') { at.setDate(at.getDate() + 1); }
    else if (unit === 'month') { at.setMonth(at.getMonth() + 1); }
    else { at.setFullYear(y + 1); }
  }
  return out;
}

var TIERS = [
  {have: 'raw',     grids: 'raw_intervals',  unit: 'day',
   name: function (g, k) { return g + '-raw-' + k; }},
  {have: 'fine',    grids: 'fine_intervals', unit: 'month',
   name: function (g, k) { return g + '-fine-' + k; }},
  {have: 'covered', grids: 'intervals',      unit: 'year',
   name: function (g, k) { return g + '-' + k; }}
];

/* Past this, the browser spends its time on readings that land on the same
   pixel. A day from the raw tier is 1440 of them, a year at hourly spacing
   8760; a year from the raw tier would be half a million. */
var MAX_POINTS = 20000;

/* The finest tier that covers this window without drowning it. Raw files hold a
   reading a minute, which is right for a day and absurd for a year: the coarser
   tiers exist for exactly that. Their spacing is in the index, one entry per
   file, so the count can be worked out before anything is fetched. */
function filesFor(group, from, to) {
  var entry = (archive.groups || []).filter(function (g) { return g.name === group; })[0];
  if (!entry) { return null; }
  var coarsest = null;
  for (var i = 0; i < TIERS.length; i++) {
    var tier = TIERS[i];
    /* Each tier is an object keyed by stamp, not a list: the value says how far
       that file is filled. */
    var have = entry[tier.have];
    if (!have || !Object.keys(have).length) { continue; }
    var keys = stamps(from, to, tier.unit).filter(function (k) {
      return Object.prototype.hasOwnProperty.call(have, k);
    });
    if (!keys.length) { continue; }

    var grids = entry[tier.grids] || {};
    var spacing = grids[keys[0]];
    var names = keys.map(function (k) { return tier.name(group, k); });
    if (spacing && (to - from) / spacing > MAX_POINTS) {
      /* Too fine for this window, but keep it: if no coarser tier reaches back
         this far, a crowded chart still beats an empty one. */
      coarsest = names;
      continue;
    }
    return names;
  }
  return coarsest;
}

function load(name) {
  if (!cache[name]) {
    cache[name] = fetch('data/archive/' + name + '.json', {cache: 'no-store'})
      .then(function (r) { return r.ok ? r.json() : null; })
      .catch(function () { return null; });
  }
  return cache[name];
}

/* A past unit is the whole unit: a day runs midnight to midnight, a month from
   the first to the first. The unit running now ends now instead, because the
   rest of it has no readings and the empty half only makes the chart smaller. */
function currentWindow() {
  var now = new Date();
  var from = step(startOf(now, span.key), span.key, -back);
  var to = back === 0 ? now : step(from, span.key, 1);
  return {from: Math.round(from.getTime() / 1000),
          to: Math.round(to.getTime() / 1000)};
}

function empty(text) {
  return {title: {text: text, left: 'center', top: 'middle',
                  textStyle: {fontSize: 12, fontWeight: 'normal', color: '#8b98a5'}},
          xAxis: {show: false}, yAxis: {show: false}, series: []};
}

function drawOne(spec, win) {
  var chart = made[spec.key];
  /* A group with nothing in the window contributes nothing; only a card whose
     groups are all empty says so. */
  var names = [];
  spec.groups.forEach(function (group) {
    var found = filesFor(group, win.from, win.to);
    if (found) { names = names.concat(found); }
  });
  if (!names.length) { chart.clear(); chart.setOption(empty(t('no_data'))); return; }

  Promise.all(names.map(load)).then(function (files) {
    files = files.filter(Boolean);
    if (!files.length) { chart.clear(); chart.setOption(empty(t('no_data'))); return; }

    /* One series per observation, strung together from every file the window
       touches. A file carries a start and a spacing rather than a timestamp per
       reading, which is what keeps it small.

       The files hold whatever unit the data report rendered in. The reader may
       have asked for another, so each value is converted on the way in, from
       the same table the live readings use. */
    var from = files[0].unit;
    var to = wantedUnit(spec.lead) || from;
    var byObs = {}, named = {};
    files.forEach(function (file) {
      (file.series || []).forEach(function (s) {
        var into = byObs[s.obs_type] || (byObs[s.obs_type] = []);
        named[s.obs_type] = nameOf(s.obs_type);
        (s.values || []).forEach(function (v, i) {
          var at = (file.start + i * file.interval) * 1000;
          if (v !== null && at >= win.from * 1000 && at <= win.to * 1000) {
            var out = convert(v, from, to);
            if (out !== null) { into.push([at, out]); }
          }
        });
      });
    });

    var unit = label(to);
    var dp = places(to);
    var series = Object.keys(byObs).map(function (obs) {
      byObs[obs].sort(function (a, b) { return a[0] - b[0]; });
      if (spec.bars) {
        var bars = intoBuckets(byObs[obs], span.bucket);
        /* Side by side, not stacked: the point of the pair is the difference
           between them, and a stack hides it. */
        return {name: named[obs], type: 'bar', data: bars,
                barMaxWidth: '46%', barGap: '0%', large: true};
      }
      return {name: named[obs], type: 'line', showSymbol: false,
              lineStyle: {width: 1.6}, data: byObs[obs]};
    });

    chart.clear();
    chart.setOption({
      animation: false,
      grid: {left: 54, right: 16, top: series.length > 1 ? 28 : 12, bottom: 24},
      tooltip: {trigger: 'axis',
                axisPointer: {type: spec.bars ? 'shadow' : 'line'},
                valueFormatter: function (v) {
                  return v === null || v === undefined ? '' : fmt(v, dp) + ' ' + unit;
                }},
      legend: {show: series.length > 1, top: 0, itemHeight: 8, itemWidth: 14,
               textStyle: {fontSize: 11}},
      xAxis: {type: 'time', axisLabel: {fontSize: 10, hideOverlap: true}},
      /* A total starts at zero. Letting the axis pick its own floor would make a
         drizzle look like a downpour. */
      yAxis: {type: 'value', scale: !spec.bars, min: spec.bars ? 0 : null,
              name: unit, nameTextStyle: {fontSize: 10},
              axisLabel: {fontSize: 10}, splitLine: {lineStyle: {opacity: .25}}},
      series: series
    });
  });
}

function draw() {
  var win = currentWindow();
  var from = new Date(win.from * 1000);
  /* The last moment inside the window, not the first one after it: a month
     window ends on the 31st, and naming the 1st of the next would be wrong. */
  var last = new Date(win.to * 1000 - 1000);

  var title;
  if (span.key === 'day') {
    title = from.toLocaleDateString(lang.locale,
      {weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'});
  } else if (span.key === 'month') {
    title = from.toLocaleDateString(lang.locale, {month: 'long', year: 'numeric'});
  } else if (span.key === 'year') {
    title = String(from.getFullYear());
  } else {
    /* The year is only worth the space where the week crosses one. */
    var shape = from.getFullYear() !== last.getFullYear()
      ? {day: 'numeric', month: 'short', year: 'numeric'}
      : {day: 'numeric', month: 'short'};
    title = from.toLocaleDateString(lang.locale, shape) + ' – '
          + last.toLocaleDateString(lang.locale, shape);
  }
  document.getElementById('when').textContent = title;

  document.getElementById('fwd').disabled = back === 0;
  document.getElementById('now').disabled = back === 0;
  CHARTS.forEach(function (spec) { drawOne(spec, win); });
}

function buildChrome() {
  var tabs = document.getElementById('spans');
  SPANS.forEach(function (s) {
    var b = document.createElement('button');
    b.dataset.text = s.text;
    b.setAttribute('aria-pressed', String(s === span));
    b.onclick = function () {
      span = s;
      tabs.querySelectorAll('button').forEach(function (other) {
        other.setAttribute('aria-pressed', String(other === b));
      });
      draw();
    };
    tabs.appendChild(b);
  });

  var charts = document.getElementById('charts');
  CHARTS.forEach(function (spec) {
    var wrap = document.createElement('div');
    wrap.innerHTML = '<div class="chart-title" data-text="' + spec.text + '"></div>'
                   + '<div class="chart"></div>';
    charts.appendChild(wrap);
    made[spec.key] = echarts.init(wrap.querySelector('.chart'), null,
                                  {renderer: 'canvas'});
  });

  document.getElementById('back').onclick = function () { back += 1; draw(); };
  document.getElementById('fwd').onclick = function () {
    back = Math.max(0, back - 1);
    draw();
  };
  document.getElementById('now').onclick = function () { back = 0; draw(); };

  window.addEventListener('resize', function () {
    Object.keys(made).forEach(function (g) { made[g].resize(); });
  });
}

/* --------------------------------------------------------------- records

   Not the answers, the numbers behind them: one row per month, written once a
   day by a Cheetah template. Which of them is the wettest year is worked out
   here, because that is a question the page asks and WeeWX need not know. */
var records = null;

function paintRecords() {
  var host = document.getElementById('records');
  if (!records || !records.months || !Object.keys(records.months).length) {
    host.hidden = true;
    return;
  }
  host.hidden = false;
  document.getElementById('records-title').textContent = t('records_title');

  var months = records.months;
  /* A year is the sum of its months. Adding them here rather than writing them
     out means one fewer figure to keep in step. */
  var years = {};
  Object.keys(months).forEach(function (key) {
    var year = key.slice(0, 4);
    if (!years[year]) { years[year] = {rain: 0, et: 0, hasET: false}; }
    if (typeof months[key].rain_sum === 'number') {
      years[year].rain += months[key].rain_sum;
    }
    if (typeof months[key].et_sum === 'number') {
      years[year].et += months[key].et_sum;
      years[year].hasET = true;
    }
  });

  /* The file says which unit its figures are in, and the reader may want
     another. The same table as everywhere else on this page. */
  var rainTo = wantedUnit('rain') || records.units.rain;
  var tempTo = wantedUnit('outTemp') || records.units.outTemp;

  function asRain(value) {
    return fmt(convert(value, records.units.rain, rainTo), places(rainTo))
         + ' ' + label(rainTo);
  }
  function asTemp(value) {
    return fmt(convert(value, records.units.outTemp, tempTo), places(tempTo))
         + ' ' + label(tempTo);
  }
  function named(key) {
    var parts = key.split('-').map(Number);
    var when = new Date(parts[0], parts[1] - 1, parts[2] || 1);
    return when.toLocaleDateString(lang.locale, parts.length > 2
      ? {day: 'numeric', month: 'long', year: 'numeric'}
      : {month: 'long', year: 'numeric'});
  }

  /* The row holding the highest or lowest value of one figure, or null where
     no row has it, or where several share it. Several sharing it is the normal
     case for the driest day: eight days of the month had no rain at all, and
     naming one of them is picking at random. */
  function edge(over, field, better) {
    var found = null, shared = false;
    Object.keys(over).forEach(function (key) {
      var value = over[key][field];
      if (typeof value !== 'number') { return; }
      if (found === null || better(value, over[found][field])) {
        found = key;
        shared = false;
      } else if (value === over[found][field]) {
        shared = true;
      }
    });
    return shared ? null : found;
  }
  var higher = function (a, b) { return a > b; };
  var lower  = function (a, b) { return a < b; };

  var rows = [];
  var days = records.days || {};

  /* An extreme needs something to be extreme against. The wettest of one year
     is also the driest of it, and a station that started in August has August
     as its warmest month and its coldest. So a pair is asked for only where
     there are two rows to choose between, and a row that cannot say anything
     yet is left out rather than filled with a truism. The panel grows by
     itself: the second year of readings brings the year rows with it. */
  function pair(over, high, low, name, as) {
    if (Object.keys(over).length < 2) { return; }
    var top = edge(over, high.field, higher);
    if (top === null) { return; }
    rows.push([t(high.text), name(top) + ': ' + as(over[top][high.field])]);
    if (!low) { return; }
    var bottom = edge(over, low.field, lower);
    if (bottom !== null && bottom !== top) {
      rows.push([t(low.text), name(bottom) + ': ' + as(over[bottom][low.field])]);
    }
  }

  var itself = function (key) { return key; };
  pair(years, {field: 'rain', text: 'wettest'}, {field: 'rain', text: 'driest'},
       itself, asRain);
  pair(months, {field: 'rain_sum', text: 'wettest_month'},
       {field: 'rain_sum', text: 'driest_month'}, named, asRain);
  /* No driest day: on any month with a dry spell the answer is a day with no
     rain, and there are always several of those. The question has no answer
     worth printing. A driest month or year does. */
  pair(days, {field: 'rain_sum', text: 'wettest_day'}, null, named, asRain);

  /* Temperature reads the finest rows the file carries. Over a full record the
     warmest month and the warmest day fall in the same week anyway, and the day
     is the one worth naming. */
  pair(Object.keys(days).length > 1 ? days : months,
       {field: 'temp_max', text: 'warmest'}, {field: 'temp_min', text: 'coldest'},
       named, asTemp);

  /* What the year has done so far. Rain is what arrived, evaporation what left
     again, and the difference is the one figure a garden actually asks for.
     WeeWX computes the evaporation itself, in StdWXCalculate, out of radiation,
     temperature, humidity and wind, so it costs no sensor the station does not
     already have.

     These stand at the top because they say something on the first day, where
     every extreme above still needs a second row to compare against. */
  var latest = Object.keys(years).sort().pop();
  if (latest) {
    var head = [[t('rain_total'), asRain(years[latest].rain)]];
    if (years[latest].hasET) {
      var left = years[latest].rain - years[latest].et;
      head.push([t('et_total'), asRain(years[latest].et)]);
      /* A minus sign where more left than arrived. The plus is written out
         because a bare number reads as a total rather than a difference. */
      head.push([t('balance'), (left > 0 ? '+' : '') + asRain(left)]);
    }
    rows = head.map(function (r) { return [r[0] + ' ' + latest, r[1]]; })
               .concat(rows);
  }

  document.getElementById('records-body').innerHTML = rows.map(function (r) {
    return '<div class="row"><div class="head"><span class="label">' + r[0]
         + '</span><span class="peak" style="margin:0">' + r[1] + '</span></div></div>';
  }).join('');
}

/* ------------------------------------------------------------------ start */

function applyLanguage() {
  document.documentElement.lang = lang.code;
  document.getElementById('place').textContent = t('station', '');
  document.querySelectorAll('[data-text]').forEach(function (el) {
    el.textContent = t(el.dataset.text);
  });
  document.getElementById('back').title = t('earlier');
  document.getElementById('fwd').title = t('later');
  document.getElementById('now').textContent = t('now');
  document.querySelectorAll('#langs button').forEach(function (b) {
    b.setAttribute('aria-pressed', String(b.dataset.code === lang.code));
  });
  showAge();
  if (latest) { paintLive(latest); }
  paintRecords();
  draw();
  pollLive();
}

function chooseLanguage(entry) {
  lang = entry;
  try { localStorage.setItem('weewxtest.lang', entry.code); } catch (e) { /* private mode */ }
  return fetch('lang/' + entry.code + '/lang.json', {cache: 'no-store'})
    .then(function (r) { return r.json(); })
    .then(function (file) { L = file; applyLanguage(); });
}

function buildLanguages() {
  var host = document.getElementById('langs');
  LANGS.forEach(function (entry) {
    var b = document.createElement('button');
    b.textContent = entry.label;
    b.dataset.code = entry.code;
    b.onclick = function () { chooseLanguage(entry); };
    host.appendChild(b);
  });
}

var remembered = null;
try { remembered = localStorage.getItem('weewxtest.lang'); } catch (e) { /* private mode */ }

Promise.all([
  fetch('data/index.json', {cache: 'no-store'}).then(function (r) { return r.json(); }),
  fetch('data/archive/index.json', {cache: 'no-store'}).then(function (r) { return r.json(); }),
  fetch('records.json', {cache: 'no-store'})
    .then(function (r) { return r.ok ? r.json() : null; })
    .catch(function () { return null; })
]).then(function (all) {
  U = all[0].units;
  archive = all[1];
  records = all[2];
  buildChrome();
  buildLanguages();
  return chooseLanguage(LANGS.filter(function (e) {
    return e.code === remembered;
  })[0] || LANGS[0]);
}).then(function () {
  setInterval(pollLive, 5000);
  setInterval(showAge, 1000);
  /* A tab that was in the background has an age that stopped counting. */
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) { pollLive(); }
  });
}).catch(function () {
  document.getElementById('charts').innerHTML =
    '<div class="note">Die Dateien unter <code>data/</code> sind nicht erreichbar.</div>';
});
</script>
</body>
</html>
