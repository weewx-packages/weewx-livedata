###############################################################################
# Writes one file: every month the station has recorded, four figures each.
# No markup, no images. A page works the answers out of the numbers.
###############################################################################

[CheetahGenerator]
    encoding = utf8

    [[ToDate]]
        [[[records]]]
            template = records.json.tmpl
            # One query per figure per month. A month that has ended never
            # changes again, so once a day is often enough. Without this the
            # whole record would be recomputed every report cycle.
            stale_age = 86400

[Generators]
    generator_list = weewx.cheetahgenerator.CheetahGenerator
