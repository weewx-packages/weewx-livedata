###############################################################################
# German.
#
# [Texts] holds the words this example adds. Anything it leaves out falls back
# to the English in skin.conf.
#
# [Labels] is the observation names, and it is taken from the German language
# file that ships with WeeWX's own skins rather than translated again here. A
# skin's language file has to carry them: WeeWX looks them up per skin, and
# without them $obs.label.outTemp answers "outTemp".
###############################################################################

[Units]
    [[TimeFormats]]
        current = "%d.%m.%Y %H:%M"

[Texts]
    "Highest gust today" = "Höchste Böe heute"
    "Day" = "Tag"
    "Week" = "Woche"
    "Month" = "Monat"
    "Year" = "Jahr"
    "Earlier" = "Früher"
    "Later" = "Später"
    "Now" = "Jetzt"
    "waiting for data" = "wartet auf Daten"
    "no data" = "keine Daten"
    "%s seconds ago" = "vor %s Sekunden"
    "%s minutes ago" = "vor %s Minuten"
    "%s hours ago" = "vor %s Stunden"
    "Temperature and dew point" = "Temperatur und Taupunkt"
    "Barometer" = "Luftdruck"
    "Wind" = "Wind"
    "Rain" = "Regen"
    "The whole record" = "Der ganze Zeitraum"
    "Wettest year" = "Nassestes Jahr"
    "Driest year" = "Trockenstes Jahr"
    "Highest temperature" = "Höchste Temperatur"
    "Lowest temperature" = "Tiefste Temperatur"
    "Wettest month" = "Nassester Monat"
    "Driest month" = "Trockenster Monat"
    "Wettest day" = "Nassester Tag"
    "Driest day" = "Trockenster Tag"
    "Rainfall" = "Niederschlag"
    "Rain and evaporation" = "Regen und Verdunstung"
    "Evaporation" = "Verdunstung"
    "Water balance" = "Wasserbilanz"

[Labels]
            
    # Set to hemisphere abbreviations suitable for your location:
    hemispheres = N, S, O, W
            
    # Generic labels, keyed by an observation type.
    [[Generic]]
        altimeter              = Luftdruck (QNH)   # QNH
        altimeterRate          = Luftdruckänderung
        appTemp                = Gefühlte Temperatur
        appTemp1               = Gefühlte Temperatur
        barometer              = Luftdruck         # QFF
        barometerRate          = Luftdruckänderung
        cloudbase              = Wolkenuntergrenze
        dateTime               = Datum/Zeit
        dewpoint               = Taupunkt
        ET                     = Evapotranspiration
        extraHumid1            = Feuchtigkeit1
        extraHumid2            = Feuchtigkeit2
        extraHumid3            = Feuchtigkeit3
        extraHumid4            = Feuchtigkeit4
        extraHumid5            = Feuchtigkeit5
        extraHumid6            = Feuchtigkeit6
        extraHumid7            = Feuchtigkeit7
        extraHumid8            = Feuchtigkeit8
        extraTemp1             = Temperatur1
        extraTemp2             = Temperatur2
        extraTemp3             = Temperatur3
        extraTemp4             = Temperatur4
        extraTemp5             = Temperatur5
        extraTemp6             = Temperatur6
        extraTemp7             = Temperatur7
        extraTemp8             = Temperatur8
        heatindex              = Hitzeindex
        inDewpoint             = Raumtaupunkt
        inHumidity             = Raumluftfeuchte
        inTemp                 = Raumtemperatur
        interval               = Intervall
        leafTemp1              = Blatttemperatur1
        leafTemp2              = Blatttemperatur2
        leafWet1               = Blattnässe1
        leafWet2               = Blattnässe2
        lightning_distance     = Blitzentfernung
        lightning_strike_count = Blitzanzahl
        luminosity             = Helligkeit
        outHumidity            = Außenluftfeuchte
        outTemp                = Außentemperatur
        pressure               = abs. Luftdruck    # QFE
        pressureRate           = Luftdruckänderung
        radiation              = Sonnenstrahlung
        rain                   = Regen
        rainRate               = Regen-Rate
        soilMoist1             = Bodenfeuchtigkeit1
        soilMoist2             = Bodenfeuchtigkeit2
        soilMoist3             = Bodenfeuchtigkeit3
        soilMoist4             = Bodenfeuchtigkeit4
        soilTemp1              = Bodentemperatur1
        soilTemp2              = Bodentemperatur2
        soilTemp3              = Bodentemperatur3
        soilTemp4              = Bodentemperatur4
        THSW                   = THSW-Index
