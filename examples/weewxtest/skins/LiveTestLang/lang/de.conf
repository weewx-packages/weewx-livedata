        wind                   = Wind
        windchill              = Windchill
        windDir                = Windrichtung
        windGust               = Böen Geschwindigkeit
        windGustDir            = Böen Richtung
        windgustvec            = Böen-Vektor
        windrun                = Windverlauf
        windSpeed              = Windgeschwindigkeit
        windvec                = Windvektor
        
        # used in Horizon skin but not defined
        feel                   = Gefühlte Temperatur

        # Sensor status indicators
        consBatteryVoltage     = Batteriespannung
        heatingVoltage         = Heizungsspannung
        inTempBatteryStatus    = Innensensor-Batteriestatus
        outTempBatteryStatus   = Außensensor-Batteriestatus
        rainBatteryStatus      = Regensensor-Batteriestatus
        referenceVoltage       = Referenzspannung
        rxCheckPercent         = Signalqualität
        supplyVoltage          = Versorgungsspannung
        txBatteryStatus        = Sender-Batteriestatus
