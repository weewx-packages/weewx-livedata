###############################################################################
# Writes one file: what a page needs to speak one language.
#
# Run once per language, each report into its own directory. The observation
# names come from WeeWX's own language files; the words below are the ones a
# page adds itself and WeeWX has no tag for.
###############################################################################

[CheetahGenerator]
    encoding = utf8

    [[ToDate]]
        [[[lang]]]
            template = lang.json.tmpl

# English. Every other language overrides these in lang/<code>.conf, and
# anything it leaves out falls back to the string here.
[Texts]
    "Highest gust today" = "Highest gust today"
    "Day" = "Day"
    "Week" = "Week"
    "Month" = "Month"
    "Year" = "Year"
    "Earlier" = "Earlier"
    "Later" = "Later"
    "Now" = "Now"
    "waiting for data" = "waiting for data"
    "no data" = "no data"
    "%s seconds ago" = "%s seconds ago"
    "%s minutes ago" = "%s minutes ago"
    "%s hours ago" = "%s hours ago"
    "Temperature and dew point" = "Temperature and dew point"
    "Barometer" = "Barometer"
    "Wind" = "Wind"
    "Rain and evaporation" = "Rain and evaporation"
    "The whole record" = "The whole record"
    "Rainfall" = "Rainfall"
    "Evaporation" = "Evaporation"
    "Water balance" = "Water balance"
    "Wettest year" = "Wettest year"
    "Driest year" = "Driest year"
    "Wettest month" = "Wettest month"
    "Driest month" = "Driest month"
    "Wettest day" = "Wettest day"
    "Highest temperature" = "Highest temperature"
    "Lowest temperature" = "Lowest temperature"

[Generators]
    generator_list = weewx.cheetahgenerator.CheetahGenerator
